services:
  mysql:
    image: mysql
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: "AppPass123!"
      MYSQL_DATABASE: root
    volumes:
      - mysql-storage:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - two-tier-backend

  flask-app:
    build: .
    container_name: two-tier-backend
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: "AppPass123!"
      MYSQL_DB: root
    ports:
      - "5000:5000"
    networks:
      - two-tier-backend

networks:
  two-tier-backend:
    driver: bridge
volumes:
  mysql-storage:
